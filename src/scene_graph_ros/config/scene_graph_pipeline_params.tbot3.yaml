# ==============================================================================
# Minimal Scene Graph Pipeline Parameters (Matterport3D)
# ==============================================================================
# Shared parameter file for:
#   ros2 launch scene_graph_ros scene_graph_pipeline_mp3d.launch.py
# ==============================================================================

semantic_perception:
  ros__parameters:
    # RGB-D input stream consumed by the class-agnostic proposal generator.
    rgb_topic: "/intel_realsense_r200_rgb/image_raw"
    depth_topic: "/intel_realsense_r200_depth/depth/image_raw"
    camera_info_topic: "/intel_realsense_r200_rgb/camera_info"
    # ObjectProposal3DArray consumed by scene_graph_region.
    proposal_topic: "/semantic_perception/object_proposals"
    # Graph frame that proposal geometry is projected into, using the transform
    # valid at the RGB image timestamp. Frames without a valid transform are
    # dropped rather than published in camera-local coordinates.
    target_frame: "odom"
    tf_timeout_sec: 0.2
    # Per-frame projection trace at DEBUG level (frames, timestamps, camera and
    # graph positions, applied transform, mask pixels, depth statistics).
    publish_projection_diagnostics: false
    publish_debug_image: true
    debug_image_topic: "/semantic_perception/debug_image"
    debug_mask_alpha: 0.45

    # HM3D class vocabulary: drives Grounding DINO prompts, the published
    # class_name, and the cached CLIP text embeddings.
    class_labels_path: "models/labels/HM3D_CountsOfObjectTypes.csv"
    class_embedding_cache_path: "models/labels/hm3d_openclip_embedding_cache.bin"
    openclip_model: "ViT-L-14"
    openclip_checkpoint_path: "models/clip/L_laion2b_s32b_b82k.bin"
    text_embedding_batch_size: 64

    # Detection + segmentation backbones.
    groundingdino_config_path: "models/groundingdino/GroundingDINO_SwinT_OGC.py"
    groundingdino_model: "models/groundingdino/groundingdino_swint_ogc.pth"
    sam_model: "models/mobilesam/mobile_sam.pt"
    sam_model_type: "vit_t"

    # Grounding DINO is prompted with the whole detector vocabulary in ONE
    # caption, "class1 . class2 . class3 .", so a frame needs a single pass
    # (https://github.com/IDEA-Research/GroundingDINO/issues/85).
    # Number of leading vocabulary labels used for that caption (the CSV is
    # ordered by descending instance count). 0 uses the whole vocabulary, which
    # exceeds the detector's 256-token text limit for the 1624-label HM3D table.
    detector_vocabulary_size: 64
    # Class labels to leave out of the detector prompt, comma separated. They stay
    # in the vocabulary and keep their cached text embeddings; they are simply
    # never prompted for, so they produce no detections and no object nodes.
    # Exclusions are applied BEFORE detector_vocabulary_size, so removing a
    # frequent class backfills the caption with the next most frequent one.
    # Large background surfaces dominate the graph without adding usable
    # structure: in a 291 s bag run they were 60 of 287 object nodes.
    excluded_class_labels: "floor, ceiling"
    # IoU above which overlapping boxes returned for the same region under
    # neighbouring labels are merged, keeping the highest-confidence detection.
    detector_merge_iou_threshold: 0.7

    device: "cuda"
    devices: ["cuda:0"]
    num_worker_threads: 0
    frame_queue_size: 4
    drop_report_every: 30
    result_queue_size: 8
    drop_stale_results: true
    shutdown_when_all_workers_failed: true
    gpu_memory_budget_gb: 12.0
    stats_report_interval_sec: 10.0

    detection_threshold: 0.35
    text_threshold: 0.25
    # fused_embedding = normalize(concat(mask, bbox, label)); dimension is 3 x D.
    sync_queue_size: 10
    sync_slop_seconds: 0.1
    min_valid_depth_points: 20
    max_depth_m: 10.0

point_cloud_generator_node:
  ros__parameters:
    depth_image_topic: "/intel_realsense_r200_depth/depth/image_raw"
    camera_info_topic: "/intel_realsense_r200_depth/depth/camera_info"
    output_frame: "camera_depth_optical_frame"
    pointcloud_topic: "/pointcloud"
    stride: 2
    min_depth: 0.01
    max_depth: 10.0
    target_hz: 2.0
    sync_queue_size: 10
    sync_slop_sec: 0.05
    qos_depth: 10
    input_qos_reliability: "reliable"
    output_qos_reliability: "reliable"

octomap_server:
  ros__parameters:
    frame_id: "odom"
    tf_cache_time_sec: 180.0
    resolution: 0.05
    # pointcloud_min_z: 0.02
    # pointcloud_max_z: 1.5
    # occupancy_min_z: 0.02
    # occupancy_max_z: 1.0
    sensor_model:
      max_range: 8.0
    latch: false
    queue_size: 200
    cloud_sub_qos_depth: 200

map_conversion_node:
  ros__parameters:
    map_frame: "odom"
    minimum_z: 0.3
    max_slope_ugv: 0.2
    slope_estimation_size: 2
    minimum_occupancy: 5
    partial_map_updates: true
    enable_debug_logging: false
    debug_log_interval: 10
    subscriber_qos_reliable: true
    subscriber_qos_transient_local: false
    publisher_qos_reliable: true
    publisher_qos_transient_local: true

scene_graph_region:
  ros__parameters:
    odom_topic: "/odom"
    object_proposals_topic: "/semantic_perception/object_proposals"
    map_topic: "/mapUAV"
    stable_regions_topic: "/dude/regions"
    fixed_frame_id: "odom"

    odom_qos_history: "keep_last"
    odom_qos_reliability: "reliable"
    odom_qos_durability: "volatile"
    odom_qos_depth: 10

    proposals_qos_history: "keep_last"
    proposals_qos_reliability: "reliable"
    proposals_qos_durability: "volatile"
    proposals_qos_depth: 10

    map_qos_history: "keep_last"
    map_qos_reliability: "reliable"
    map_qos_durability: "volatile"
    map_qos_depth: 10

    stable_regions_qos_history: "keep_last"
    stable_regions_qos_reliability: "reliable"
    stable_regions_qos_durability: "volatile"
    stable_regions_qos_depth: 20
    ignore_empty_region_updates_after_valid: true
    materialize_observed_regions: true

    pipeline_hz: 1.0
    maintenance_hz: 0.5
    visualization_hz: 2.0
    process_map_in_callback: false
    maintenance_tick_warn_ms: 500.0

    pose_distance_threshold: 0.5
    pose_time_threshold: 10.0
    pose_window_size: 3

    # Object association. A proposal with no object node within
    # object_spatial_association_distance creates one. When nearby nodes exist,
    # the best cosine match at or above object_semantic_similarity_threshold is
    # updated; if none qualifies the detection is counted as spatially ambiguous
    # and no node is created.
    object_spatial_association_distance: 0.75   # metres
    object_semantic_similarity_threshold: 0.70  # cosine similarity, [-1, 1]
    object_position_update_policy: "running_mean"
    # Metres an object position may lie outside a DuDe region polygon and still
    # be attached to that room. Used only to break ties for outside points.
    object_room_boundary_tolerance: 0.10        # metres

    room_z_offset: 12.0
    region_z_offset: 8.0
    nav_region_boundary_epsilon_m: 0.5
    nav_region_enable_neighbor_tiebreak: false

    fs_cell_stride_cells: 15
    fs_min_free_cell_count: 25
    fs_z_offset: 4.0
    fs_navigation_connectivity: 8
    nearest_link_max_distance_m: 1.0

    scene_graph_topic: "/dsg/scene_graph"
    scene_graph_qos_history: "keep_last"
    scene_graph_qos_reliability: "reliable"
    scene_graph_qos_durability: "volatile"
    scene_graph_qos_depth: 10

    enable_debug_logging: true
    debug_log_interval: 10
    life_time: 0.0

    # Visualization defaults keep the main scene readable while batching dense layers.
    enable_pose_markers: true
    enable_pose_labels: false
    enable_object_markers: true
    enable_object_labels: true
    enable_room_markers: true
    enable_room_labels: true
    enable_region_markers: true
    enable_region_labels: true
    enable_navigation_markers: true
    enable_navigation_labels: false
    enable_pose_edges: true
    enable_observation_edges: true
    enable_navigation_edges: true
    enable_region_contains_edges: true
    enable_room_region_edges: true
    enable_room_adjacency_edges: true
    enable_nearest_freespace_edges: true

    export_json_path: "/workspace/occusg_ws/scene_graph.json"
    export_json_on_shutdown: true
    export_json_compact: false

    pose_marker_stride: 1
    pose_label_stride: 1
    pose_edge_stride: 1
    navigation_marker_stride: 1
    navigation_label_stride: 1
    navigation_edge_stride: 1

    visualization_warn_ms: 250.0
    visualization_stats_interval: 20
